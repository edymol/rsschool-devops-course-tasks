name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    name: 'Terraform Format Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Fmt
        run: terraform -chdir=environments/dev fmt -check

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: terraform-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Create terraform.tfvars
        run: |
          cat << EOF > environments/dev/terraform.tfvars
          aws_region         = "eu-west-1"
          s3_bucket_name     = "${{ secrets.TF_S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.TF_GITHUB_ORG }}"
          github_repository   = "${{ secrets.TF_GITHUB_REPO }}"
          aws_account_id     = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name          = "GithubActionsRole"
          policy_arns        = [
            "arn:aws:iam::aws:policy/AmazonEC2FullAccess",
            "arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess",
            "arn:aws:iam::aws:policy/AmazonRoute53FullAccess",
            "arn:aws:iam::aws:policy/AmazonS3FullAccess",
            "arn:aws:iam::aws:policy/AmazonSQSFullAccess",
            "arn:aws:iam::aws:policy/AmazonVPCFullAccess",
            "arn:aws:iam::aws:policy/IAMFullAccess"
          ]
          EOF
      - name: Debug OIDC Token
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq .
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1
          audience: sts.amazonaws.com
      - name: Terraform Init
        id: init
        run: terraform -chdir=environments/dev init
      - name: Terraform Plan
        id: plan
        run: terraform -chdir=environments/dev plan -no-color

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Create terraform.tfvars
        run: |
          cat << EOF > environments/dev/terraform.tfvars
          aws_region         = "eu-west-1"
          s3_bucket_name     = "${{ secrets.TF_S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.TF_GITHUB_ORG }}"
          github_repository   = "${{ secrets.TF_GITHUB_REPO }}"
          aws_account_id     = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name          = "GithubActionsRole"
          policy_arns        = [
            "arn:aws:iam::aws:policy/AmazonEC2FullAccess",
            "arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess",
            "arn:aws:iam::aws:policy/AmazonRoute53FullAccess",
            "arn:aws:iam::aws:policy/AmazonS3FullAccess",
            "arn:aws:iam::aws:policy/AmazonSQSFullAccess",
            "arn:aws:iam::aws:policy/AmazonVPCFullAccess",
            "arn:aws:iam::aws:policy/IAMFullAccess"
          ]
          EOF
      - name: Debug OIDC Token
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq .
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1
          audience: sts.amazonaws.com
      - name: Terraform Init
        run: terraform -chdir=environments/dev init
      - name: Terraform Apply
        run: terraform -chdir=environments/dev apply -auto-approve