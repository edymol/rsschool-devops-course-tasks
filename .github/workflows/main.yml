# .github/workflows/deploy.yml

name: Deploy React App with Helm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository's code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up kubectl and authenticate to your cluster
      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          # This secret must be created in your GitHub repository settings
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # Step 3: Deploy the application using your Helm chart
      - name: Deploy with Helm
        run: |
          helm upgrade --install my-react-app ./my-react-chart \
            --namespace default \
            --set image.tag=${{ github.sha }} # Best practice: Tag image with the Git commit SHA