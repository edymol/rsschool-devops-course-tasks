name: 'Deploy Infrastructure on Merge to Main'

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  TF_WORKING_DIR: ./infrastructure/environments/dev

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      # ✅ THIS STEP IS CRITICAL AND HAS BEEN ADDED BACK
      - name: Create terraform.tfvars
        run: |
          cat << EOF > ${{ env.TF_WORKING_DIR }}/terraform.tfvars
          aws_region          = "eu-west-1"
          s3_bucket_name      = "${{ secrets.S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.GITHUB_ORG }}"
          github_repository   = "${{ github.event.repository.name }}"
          aws_account_id      = "${{ secrets.AWS_ACCOUNT_ID }}"
          # Add any other variables your project needs
          EOF

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: plan

    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      # ✅ THIS STEP IS CRUCIAL AND HAS BEEN ADDED BACK
      - name: Create terraform.tfvars
        run: |
          cat << EOF > ${{ env.TF_WORKING_DIR }}/terraform.tfvars
          aws_region          = "eu-west-1"
          s3_bucket_name      = "${{ secrets.S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.GITHUB_ORG }}"
          github_repository   = "${{ github.event.repository.name }}"
          aws_account_id      = "${{ secrets.AWS_ACCOUNT_ID }}"
          # Add any other variables your project needs
          EOF

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
