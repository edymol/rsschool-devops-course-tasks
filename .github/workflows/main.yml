name: Deploy Jenkins with Helm

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # --- ADD THIS NEW STEP ---
      - name: Extract CA Certificate
        run: |
          echo "--- Extracting CA certificate from kubeconfig ---"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
          echo "CA certificate extracted."

      - name: Deploy Jenkins
        run: |
          helm repo add jenkins https://charts.jenkins.io
          helm repo update
          # --- MODIFY THE HELM COMMAND ---
          helm upgrade --install jenkins jenkins/jenkins \
            --namespace jenkins \
            --create-namespace \
            -f values.yaml \
            --ca-file ca.crt # <-- Add this flag to force trust