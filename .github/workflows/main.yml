---
name: Terraform CI/CD
on:
  push:
    branches:
      - main
      - task-3
  pull_request: null
permissions:
  id-token: write
  contents: read
jobs:
  terraform-check:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Fmt
        run: terraform -chdir=environments/dev fmt -check
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Create terraform.tfvars
        run: |
          cat << EOF > environments/dev/terraform.tfvars
          aws_region          = "eu-west-1"
          s3_bucket_name      = "${{ secrets.TF_S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.TF_GITHUB_ORG }}"
          github_repository   = "${{ secrets.TF_GITHUB_REPO }}"
          aws_account_id      = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name           = "GithubActionsRole"
          policy_arns         = [
            "arn:aws:iam::aws:policy/AmazonEC2FullAccess",
            "arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess",
            "arn:aws:iam::aws:policy/AmazonRoute53FullAccess",
            "arn:aws:iam::aws:policy/AmazonS3FullAccess",
            "arn:aws:iam::aws:policy/AmazonSQSFullAccess",
            "arn:aws:iam::aws:policy/AmazonVPCFullAccess",
            "arn:aws:iam::aws:policy/IAMFullAccess"
          ]
          kms_key_arn         = "${{ secrets.TF_KMS_KEY_ARN }}"
          vpc_cidr_block      = "10.0.0.0/16"
          public_subnet_cidrs = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnet_cidrs = ["10.0.3.0/24", "10.0.4.0/24"]
          availability_zones  = ["eu-west-1a", "eu-west-1b"]
          bastion_ami         = "ami-0a8e566d0e6df5b5b"
          instance_type       = "t2.micro"
          key_name            = "task3-bastion-key"
          project_name        = "task3"
          ec2_ami_id          = "ami-0a8e566d0e6df5b5b"
          EOF
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1
          audience: sts.amazonaws.com
      - name: Terraform Init
        run: >
          terraform -chdir=environments/dev init \
            -backend-config="kms_key_id=${{ secrets.TERRAFORM_BACKEND_KMS_KEY_ID }}"
      - name: Terraform Plan
        run: terraform -chdir=environments/dev plan -no-color
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Create terraform.tfvars
        run: |
          cat << EOF > environments/dev/terraform.tfvars
          aws_region          = "eu-west-1"
          s3_bucket_name      = "${{ secrets.TF_S3_BUCKET_NAME }}"
          github_organization = "${{ secrets.TF_GITHUB_ORG }}"
          github_repository   = "${{ secrets.TF_GITHUB_REPO }}"
          aws_account_id      = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name           = "GithubActionsRole"
          policy_arns         = [
            "arn:aws:iam::aws:policy/AmazonEC2FullAccess",
            "arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess",
            "arn:aws:iam::aws:policy/AmazonRoute53FullAccess",
            "arn:aws:iam::aws:policy/AmazonS3FullAccess",
            "arn:aws:iam::aws:policy/AmazonSQSFullAccess",
            "arn:aws:iam::aws:policy/AmazonVPCFullAccess",
            "arn:aws:iam::aws:policy/IAMFullAccess"
          ]
          kms_key_arn         = "${{ secrets.TF_KMS_KEY_ARN }}"
          vpc_cidr_block      = "10.0.0.0/16"
          public_subnet_cidrs = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnet_cidrs = ["10.0.3.0/24", "10.0.4.0/24"]
          availability_zones  = ["eu-west-1a", "eu-west-1b"]
          bastion_ami         = "ami-0a8e566d0e6df5b5b"
          instance_type       = "t2.micro"
          key_name            = "task3-bastion-key"
          project_name        = "task3"
          ec2_ami_id          = "ami-0a8e566d0e6df5b5b"
          EOF
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1
          audience: sts.amazonaws.com
      - name: Terraform Init
        run: >
          terraform -chdir=environments/dev init \
            -backend-config="kms_key_id=${{ secrets.TERRAFORM_BACKEND_KMS_KEY_ID }}"
      - name: Terraform Apply
        run: terraform -chdir=environments/dev apply -auto-approve
      - name: Write SSH Key
        run: >
          terraform -chdir=environments/dev output -raw bastion_private_key >
          /tmp/bastion_key.pem

          chmod 400 /tmp/bastion_key.pem
      - name: Get Bastion Public IP
        id: bastion_ip
        run: >
          echo "bastion_ip=$(terraform -chdir=environments/dev output -raw
          bastion_public_ip)" >> $GITHUB_OUTPUT
      - name: Install kubectl on Bastion
        run: >
          ssh -i /tmp/bastion_key.pem -o StrictHostKeyChecking=no ubuntu@${{
          steps.bastion_ip.outputs.bastion_ip }} << 'EOF'
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            mkdir -p ~/.kube
          EOF
      - name: Copy Kubeconfig to Bastion
        run: >
          ssh -i /tmp/bastion_key.pem -o StrictHostKeyChecking=no ubuntu@${{
          steps.bastion_ip.outputs.bastion_ip }} << 'EOF'
            scp -i /tmp/bastion_key.pem -o ProxyCommand="ssh -i /tmp/bastion_key.pem -W %h:%p ubuntu@${{ steps.bastion_ip.outputs.bastion_ip }}" ubuntu@$(terraform -chdir=environments/dev output -raw k3s_server_private_ip):/etc/rancher/k3s/k3s.yaml ~/.kube/config
            sed -i "s/127.0.0.1/$(terraform -chdir=environments/dev output -raw k3s_server_private_ip)/g" ~/.kube/config
          EOF
      - name: Verify Cluster
        run: >
          ssh -i /tmp/bastion_key.pem -o StrictHostKeyChecking=no ubuntu@${{
          steps.bastion_ip.outputs.bastion_ip }} << 'EOF'
            kubectl get nodes
          EOF
      - name: Deploy Simple Workload
        run: >
          ssh -i /tmp/bastion_key.pem -o StrictHostKeyChecking=no ubuntu@${{
          steps.bastion_ip.outputs.bastion_ip }} << 'EOF'
            kubectl apply -f https://k8s.io/examples/pods/simple-pod.yaml
            kubectl get pods
          EOF
      - name: Fetch Kubeconfig for Local Access
        run: >
          ssh -i /tmp/bastion_key.pem -o StrictHostKeyChecking=no ubuntu@${{
          steps.bastion_ip.outputs.bastion_ip }} << 'EOF'
            scp -i /tmp/bastion_key.pem -o ProxyCommand="ssh -i /tmp/bastion_key.pem -W %h:%p ubuntu@${{ steps.bastion_ip.outputs.bastion_ip }}" ubuntu@$(terraform -chdir=environments/dev output -raw k3s_server_private_ip):/etc/rancher/k3s/k3s.yaml /tmp/kubeconfig
            sed -i "s/127.0.0.1/$(terraform -chdir=environments/dev output -raw k3s_server_private_ip)/g" /tmp/kubeconfig
          EOF
      - name: Save Artifacts for Local Access
        uses: actions/upload-artifact@v4
        with:
          name: k3s-access
          path: |
            /tmp/bastion_key.pem
            /tmp/kubeconfig
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible
      - name: Generate Ansible Inventory
        run: |
          cd environments/dev
          chmod +x generate_ansible_inventory.sh
          ./generate_ansible_inventory.sh
      - name: Run Ansible Playbook
        run: |
          cd environments/dev
          ansible-playbook -i ansible_inventory.ini ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
