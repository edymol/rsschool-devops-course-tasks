# .github/workflows/deploy.yml

name: Terraform K3s Deployment with Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  TF_WORKING_DIR: infrastructure/environments/dev

permissions:
  id-token: write
  contents: read # Required to checkout code

jobs:
  terraform-plan: # Separate job for plan (e.g., on PRs)
    name: 'Terraform Plan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Install Ansible, jq, dos2unix
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip jq dos2unix
          pip install ansible

      - name: Set up SSH Private Key for Remote Access
        # This creates the .pem and .pub files on the runner for Terraform's remote-exec and Ansible
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem"
          chmod 400 "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem"
          ssh-keygen -y -f "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem" > "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pub"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_NAME }} # Use GitHub Vars for role name
          aws-region: ${{ env.AWS_REGION }}
          # 'audience' is typically configured in the IAM trust policy itself, not directly here.

      - name: Create terraform.tfvars
        # This dynamically creates the terraform.tfvars file with values from GitHub Secrets/Variables
        run: |
          cat << EOF > ${{ env.TF_WORKING_DIR }}/terraform.tfvars
          aws_region            = "${{ env.AWS_REGION }}"
          s3_bucket_name        = "${{ vars.S3_BUCKET_NAME }}"
          github_organization   = "${{ vars.GITHUB_ORG }}"
          github_repository     = "${{ github.event.repository.name }}"
          aws_account_id        = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name             = "${{ vars.IAM_ROLE_NAME }}"
          kms_key_arn           = "${{ secrets.KMS_KEY_ARN }}"
          policy_arns = ${{ toJson(vars.POLICY_ARNS) }} # Convert GitHub Actions list variable to JSON
          vpc_cidr_block        = "10.0.0.0/16"
          public_subnet_cidrs   = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnet_cidrs  = ["10.0.3.0/24", "10.0.4.0/24"]
          availability_zones    = ["eu-west-1a", "eu-west-1b"]
          bastion_ami           = "ami-01f23391a59163da9" # Ensure this is the correct Ubuntu 24.04 AMI for eu-west-1
          instance_type         = "t2.micro"
          project_name          = "task2"
          ec2_ami_id            = "ami-01f23391a59163da9" # Ensure this is the correct Ubuntu 24.04 AMI for eu-west-1
          key_name              = "task2-bastion-key" # Your key name
          EOF

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure -backend-config="${{ env.TF_WORKING_DIR }}/backend.conf"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}


  terraform-apply: # Job to apply changes (only on push to main)
    name: 'Terraform Apply & Ansible Provision'
    runs-on: ubuntu-latest
    needs: terraform-plan # Depends on plan job succeeding
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only run on push to main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x.x

      - name: Install Ansible, jq, dos2unix
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip jq dos2unix
          pip install ansible

      - name: Set up SSH Private Key for Remote Access
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem"
          chmod 400 "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem"
          ssh-keygen -y -f "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pem" > "${{ env.TF_WORKING_DIR }}/task2-bastion-key.pub"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars
        run: |
          cat << EOF > ${{ env.TF_WORKING_DIR }}/terraform.tfvars
          aws_region            = "${{ env.AWS_REGION }}"
          s3_bucket_name        = "${{ vars.S3_BUCKET_NAME }}"
          github_organization   = "${{ vars.GITHUB_ORG }}"
          github_repository     = "${{ github.event.repository.name }}"
          aws_account_id        = "${{ secrets.AWS_ACCOUNT_ID }}"
          role_name             = "${{ vars.IAM_ROLE_NAME }}"
          kms_key_arn           = "${{ secrets.KMS_KEY_ARN }}"
          policy_arns = ${{ toJson(vars.POLICY_ARNS) }}
          vpc_cidr_block        = "10.0.0.0/16"
          public_subnet_cidrs   = ["10.0.1.0/24", "10.0.2.0/24"]
          private_subnet_cidrs  = ["10.0.3.0/24", "10.0.4.0/24"]
          availability_zones    = ["eu-west-1a", "eu-west-1b"]
          bastion_ami           = "ami-01f23391a59163da9" # Corrected AMI
          instance_type         = "t2.micro"
          project_name          = "task2"
          ec2_ami_id            = "ami-01f23391a59163da9" # Corrected AMI
          key_name              = "task2-bastion-key"
          EOF

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="${{ env.TF_WORKING_DIR }}/backend.conf"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Generate Ansible Inventory
        run: ./generate_ansible_inventory.sh
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory.ini ansible/playbook.yml
        working-directory: ${{ env.TF_WORKING_DIR }}