---
- name: Setup K3s Cluster
  hosts: k3s_nodes
  become: yes
  gather_facts: no

  tasks:
    - name: Ensure Python is installed (if not by user_data)
      ansible.builtin.raw: apt update -y && apt install -y python3-pip
      register: raw_output
      changed_when: raw_output.rc != 0

- name: Setup K3s Server
  hosts: k3s_server_node
  become: yes
  roles:
    - k3s_server

- name: Setup K3s Agent
  hosts: k3s_agent_node
  become: yes
  roles:
    - k3s_agent