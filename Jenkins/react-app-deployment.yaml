apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-react-app-deployment
  labels:
    app: my-react-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-react-app
  template:
    metadata:
      labels:
        app: my-react-app
    spec:
      containers:
      - name: my-react-app
        # <-- MODIFIED: Using your new image
        image: edydockers/rsschool:latest
        ports:
        # <-- MODIFIED: Using your new container port
        - containerPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: my-react-app-service
  labels:
    app: my-react-app
spec:
  type: ClusterIP
  selector:
    app: my-react-app
  ports:
  # <-- MODIFIED: The service exposes and targets your new port
  - port: 9999
    targetPort: 9999
